; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:due]
platform = atmelsam
board = due
framework = arduino
debug_tool = stlink
upload_protocol = stlink
board_upload.offset_address = 0x80000
build_flags =     -Wno-unused-function
    -Wno-pointer-sign
    -Wno-incompatible-pointer-types
    -Wno-comment
    -Wno-dangling-else
    -Wno-unused-variable     ; 添加这行来忽略未使用变量的警告
    -Wno-unused-but-set-variable  ; 添加这行处理已赋值但未使用的变量警告
    -Wl,-Map,firmware.map
   -save-temps=obj
   -fverbose-asm
board_build.ldscript = D:\Onedrive\code\flash copy 2.ld

; monitor_speed = 115200   ; 添加这一行

monitor_speed = 460800   ; 添加这一行

monitor_filters = 
    default
    time    
    log2file

; monitor_port = COM5

; upload_port = COM5